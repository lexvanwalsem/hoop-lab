name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # the models (about 50 MB) are not needed for the tests or the build
      - run: SKIP_MODELS=1 npm ci
      - run: npm test
      - run: npm run build
